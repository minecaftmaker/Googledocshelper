<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | Schoology</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <style>
    body {
      margin: 0;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    button {
      padding: 16px 28px;
      border: 0;
      border-radius: 10px;
      background: #60a5fa;
      color: #111827;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="play">Opps! Schoology encountered an error! Click here to refresh Schoology. (You May need to login again.)</button>

  <script>
    document.getElementById("play").addEventListener("click", () => {
      const game = window.open("about:blank", "_blank");

      if (!game) {
        alert("Allow pop-ups and try again.");
        return;
      }

      game.document.open();
      game.document.write(`<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Math Practice</title>
  <link rel="icon" type="image/png"
  href="https://github.com/minecaftmaker/Googledocshelper/favicon.png">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    src="https://bloxd.io/"
    title="Math Practice"
    allow="fullscreen; gamepad"
    allowfullscreen>
  </iframe>
</body>
</html>`);
      game.document.close();
    });
  </script>
</body>
</html>
